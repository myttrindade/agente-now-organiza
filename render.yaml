services:
  - type: web
    name: agente-now-organiza
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MYTEK_HUB_MCP_URL
        sync: false
      - key: MYTEK_HUB_MCP_TOKEN
        sync: false
