<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente Now Organiza — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-from: #175dfc;
    --brand-via: #3180ff;
    --brand-to: #00a6ee;
    --foreground: #0a0a0a;
    --muted-foreground: #737373;
    --muted: #f5f5f5;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--foreground);
    background: linear-gradient(180deg, #eef3ff 0%, #ffffff 320px);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-from), var(--brand-to));
  }
  header strong { font-size: 16px; }
  header span { font-size: 12.5px; color: var(--muted-foreground); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 140px;
  }

  .intro {
    text-align: center;
    margin-bottom: 28px;
  }
  .intro h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .intro p {
    color: var(--muted-foreground);
    font-size: 14.5px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.55;
  }
  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 18px;
  }
  .example-btn {
    font-size: 12.5px;
    font-family: inherit;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    color: var(--foreground);
  }
  .example-btn:hover { border-color: var(--brand-from); color: var(--brand-from); }

  .msg { margin: 14px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--brand-from); color: #fff; }
  .msg.assistant .bubble { background: #fff; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(15,23,42,.04); }

  .step {
    max-width: 80%;
    margin: 8px 0;
    font-size: 12.5px;
    font-family: 'SFMono-Regular', Consolas, monospace;
  }
  .step .call {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eef3ff;
    color: var(--brand-from);
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 600;
  }
  .step .result {
    margin-top: 4px;
    color: var(--muted-foreground);
    padding-left: 10px;
    border-left: 2px solid var(--border);
  }

  .inputbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
  }
  .inputbar form {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .inputbar input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }
  .inputbar input:focus { border-color: var(--brand-from); }
  .inputbar button {
    background: var(--brand-from);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0 22px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .inputbar button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <strong>agente-now-organiza</strong>
  <span>· conectado ao mytek-hub via MCP</span>
</header>

<main>
  <div class="intro" id="intro">
    <h1>Peça alguma coisa pro agente</h1>
    <p>
      Ele decide sozinho quais ferramentas do Now Organiza (mytek-hub) chamar
      — criar tarefa, listar, editar, comentar — e você vê cada chamada
      acontecendo aqui embaixo, em tempo real.
    </p>
    <div class="examples">
      <button class="example-btn" data-msg="Quais tarefas eu tenho abertas?">Quais tarefas eu tenho abertas?</button>
      <button class="example-btn" data-msg='Cria uma tarefa "Ligar pro cliente" pra mim, prazo pra amanhã.'>Criar uma tarefa</button>
      <button class="example-btn" data-msg="Quantas tarefas eu tenho em cada status?">Resumo por status</button>
    </div>
  </div>

  <div id="messages"></div>
</main>

<div class="inputbar">
  <form id="form">
    <input id="input" type="text" placeholder="Peça algo ao agente..." autocomplete="off">
    <button id="send" type="submit">Enviar</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const introEl = document.getElementById('intro');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  document.querySelectorAll('.example-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.msg;
      form.dispatchEvent(new Event('submit'));
    });
  });

  function addUserBubble(text) {
    introEl.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg user';
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(row);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function addStep(html) {
    const div = document.createElement('div');
    div.className = 'step';
    div.innerHTML = html;
    messagesEl.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function renderMarkdownLite(text) {
    // Só negrito e links markdown — o suficiente pro que o modelo gera
    // aqui, sem puxar uma lib de markdown inteira só pra isso.
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function addAssistantBubble(text) {
    const row = document.createElement('div');
    row.className = 'msg assistant';
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector('.bubble').innerHTML = renderMarkdownLite(text);
    messagesEl.appendChild(row);
    window.scrollTo(0, document.body.scrollHeight);
  }

  async function send(message) {
    addUserBubble(message);
    input.value = '';
    sendBtn.disabled = true;

    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalText = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const evt = JSON.parse(part.slice(6));

        if (evt.type === 'tool_call') {
          addStep(
            '<div class="call">🔧 ' + evt.name + '(' + JSON.stringify(evt.args) + ')</div>'
          );
        } else if (evt.type === 'tool_result') {
          addStep('<div class="result">↳ ' + escapeHtml(evt.text) + '</div>');
        } else if (evt.type === 'content') {
          finalText = evt.text;
        } else if (evt.type === 'error') {
          finalText = '⚠️ ' + evt.text;
        }
      }
    }

    if (finalText) addAssistantBubble(finalText);
    history.push({ role: 'user', content: message });
    history.push({ role: 'assistant', content: finalText });
    sendBtn.disabled = false;
    input.focus();
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = input.value.trim();
    if (!msg) return;
    send(msg);
  });
</script>

</body>
</html>
